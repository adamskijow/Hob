# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify runtime syntax
        run: uv run python -m compileall -q app.py config.py core adapters

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/hob-requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/hob-requirements.txt"

      - name: Build EventKit bridge
        if: runner.os == 'macOS'
        run: scripts/build_calendar_bridge.sh

      - name: Build and test App Store foundation
        if: runner.os == 'macOS'
        run: swift test --package-path native/HobAppFoundation

      - name: Build and test Open Local menu bar
        if: runner.os == 'macOS'
        run: |
          swift test --package-path native/HobOpenLocalMenu
          swift build -c release --package-path native/HobOpenLocalMenu
          plutil -lint deploy/com.local.hob.menu.plist native/HobOpenLocalMenu/Resources/Info.plist
          bash -n scripts/setup.sh scripts/install_macos.sh scripts/hobctl

      - name: Build App Store shell bundle
        if: runner.os == 'macOS'
        run: |
          xcodebuild \
            -project native/HobMacApp/HobMacApp.xcodeproj \
            -scheme Hob \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/hob-macapp-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -x "$RUNNER_TEMP/hob-macapp-derived/Build/Products/Debug/Hob.app/Contents/MacOS/Hob"
          test ! -e "$RUNNER_TEMP/hob-macapp-derived/Build/Products/Debug/Hob.app/Contents/Library/LoginItems/HobAgent.app"

      - name: Build iPhone app
        if: runner.os == 'macOS'
        run: |
          xcodebuild \
            -project native/HobAppleApps/HobAppleApps.xcodeproj \
            -scheme HobiOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/hob-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -x "$RUNNER_TEMP/hob-ios-derived/Build/Products/Debug-iphonesimulator/Hob.app/Hob"

      - name: Test
        run: uv run pytest
